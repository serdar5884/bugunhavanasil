name: Haber testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q pillow
          python - <<'PY'
          from haber_bot import haberleri_cek
          from collections import defaultdict
          h = haberleri_cek(); g = defaultdict(list)
          for x in h: g[x["kaynak"]].append(x)
          for k, v in g.items():
              tarihli = [x for x in v if x["tarih"]]
              print(f"{k}: {len(v)} haber, {len(tarihli)} tarihli, en yeni {max((x['tarih'] for x in tarihli), default=None)}")
          PY
          python -u haber_bot.py --liste
