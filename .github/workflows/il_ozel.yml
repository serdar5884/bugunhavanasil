name: İle özel görsel (test / ortak gönderi)
on:
  workflow_dispatch:
    inputs:
      il: {default: "Sivas"}
      gun: {default: "1"}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter >/dev/null
          pip install -q -r requirements.txt
          python -u il_ozel.py --il "${{ inputs.il }}" --gun ${{ inputs.gun }} --cikti yayin/il_ozel
          git config user.name hava-bot && git config user.email hava-bot@users.noreply.github.com
          git add yayin/il_ozel && git commit -qm "İle özel görsel" && git pull --rebase -q origin main && git push -q
