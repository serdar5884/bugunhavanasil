name: Bölge hava durumu (sabah bugün, akşam yarın)

on:
  schedule:
    - cron: "17 4 * * *"   # her gün 07:17 (Türkiye saati) -> BUGÜN
    - cron: "13 17 * * *"  # her gün 20:13 (Türkiye saati) -> YARIN
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
    inputs:
      gun:
        description: "1 = bugün, 2 = yarın"
        default: "1"

permissions:
  contents: write

env:
  IG_TOKEN: ${{ secrets.IG_TOKEN }}

jobs:
  hava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Font ve kütüphaneler
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements.txt
      - name: Görselleri üret
        run: |
          if [ "${{ github.event.schedule }}" = "13 17 * * *" ]; then GUN=2; else GUN=${{ inputs.gun || '1' }}; fi
          if [ "$GUN" = "2" ]; then KLASOR=yayin/aksam; else KLASOR=yayin/gunluk; fi
          echo "KLASOR=$KLASOR" >> $GITHUB_ENV
          python -u hava_bot.py --gun $GUN --cikti $KLASOR
      - name: Görselleri depoya kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "hava-bot@users.noreply.github.com"
          git add $KLASOR
          git commit -m "Hava görselleri ($KLASOR) $(date +%F)" || echo "değişiklik yok"
          git pull --rebase -q origin main && git push
      - name: Instagram'a paylaş
        if: ${{ env.IG_TOKEN != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -u instagram_paylas.py karusel $KLASOR
