name: Bölge hava durumu (sabah bugün, akşam yarın, cuma hafta sonu)

on:
  # Zamanlama cron-job.org'dan yapılıyor (07:17 gun=1, 20:13 gun=2, uyarılar her 30 dk)
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma
    inputs:
      gun:
        description: "1 = bugün, 2 = yarın, hs = hafta sonu"
        default: "1"

permissions:
  contents: write

env:
  IG_TOKEN: ${{ secrets.IG_TOKEN }}

jobs:
  hava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Font ve kütüphaneler
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter ffmpeg
          pip install -r requirements.txt
      - name: Görselleri üret
        run: |
          if [ "${{ github.event.schedule }}" = "13 17 * * *" ]; then GUN=2; else GUN=${{ inputs.gun || '1' }}; fi
          if [ "$GUN" = "2" ]; then KLASOR=yayin/aksam; elif [ "$GUN" = "hs" ]; then KLASOR=yayin/haftasonu; else KLASOR=yayin/gunluk; fi
          echo "KLASOR=$KLASOR" >> $GITHUB_ENV
          echo "GUN=$GUN" >> $GITHUB_ENV
          if [ "$GUN" = "hs" ]; then python -u hava_bot.py --hafta-sonu --animasyon --cikti $KLASOR; else python -u hava_bot.py --gun $GUN --animasyon --cikti $KLASOR; fi
          rm -f $KLASOR/reels.mp4 $KLASOR/reels_kapak.jpg $KLASOR/muzik.txt $KLASOR/kanca.txt
          python -u reels_bot.py $KLASOR || echo "Reels üretilemedi"
          # yurt geneli önemli gelişmeler (kar geliyor, soğuk hava dalgası...)
          # ortak sayfalı illere özel görsel (sadece sabah)
          if [ "$GUN" = "1" ]; then for IL in $(python -c "import json;print(' '.join(json.load(open('ortaklar.json'))))"); do python -u il_ozel.py --il $IL --gun 1 --video --cikti yayin/il_ozel/$IL || echo "$IL görseli üretilemedi"; done; fi
          if [ "$GUN" != "hs" ]; then python -u ulke_bot.py --cikti yayin/ulke || echo "Yurt geneli kontrol hatası"; fi
      - name: Görselleri depoya kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "hava-bot@users.noreply.github.com"
          git add yayin/il_ozel 2>/dev/null; git add $KLASOR yayin/ulke ulke_durum.json 2>/dev/null; git add $KLASOR
          git commit -m "Hava görselleri ($KLASOR) $(date +%F)" || echo "değişiklik yok"
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q && break; sleep $((RANDOM % 5 + 2)); done
      - name: Instagram'a paylaş
        if: ${{ env.IG_TOKEN != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -u instagram_paylas.py karusel $KLASOR || echo "Kaydırmalı gönderi paylaşılamadı"
          if [ -f $KLASOR/reels.mp4 ]; then python -u instagram_paylas.py reels $KLASOR || echo "Reels paylaşılamadı"; fi
          if [ "$GUN" = "1" ]; then for IL in $(python -c "import json;print(' '.join(json.load(open('ortaklar.json'))))"); do [ -f yayin/il_ozel/$IL/son.txt ] && python -u instagram_paylas.py ozel "$(cat yayin/il_ozel/$IL/son.txt)" $IL || echo "$IL paylaşılamadı"; done; fi
          if [ "$GUN" != "hs" ] && [ -f yayin/ulke/paylasim.json ]; then python -u instagram_paylas.py uyari yayin/ulke || echo "Yurt geneli paylaşılamadı"; fi
