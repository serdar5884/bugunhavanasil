name: Yorum cevabı dene
on:
  workflow_dispatch:
    inputs:
      metin: {default: "Sivas 5 günlük"}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt && python yorum_bot.py --dene "${{ inputs.metin }}"
