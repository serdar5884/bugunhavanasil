name: Yurt geneli kuru test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q pillow
          python - <<'PY'
          from ulke_bot import tum_tahminler, tespit, paragraf
          for o in tespit(tum_tahminler()):
              print(o["baslik"], o["tarih"], len(o["iller"]), "il |", paragraf(o))
          print("bitti")
          PY
