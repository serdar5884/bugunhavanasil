name: Uyarılar, kapalı yollar ve son dakika hava haberleri

on:
  # Zamanlama cron-job.org'dan yapılıyor (06:43 gun=1, 20:13 gun=2, uyarılar her 30 dk)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: uyarilar
  cancel-in-progress: false

env:
  IG_TOKEN: ${{ secrets.IG_TOKEN }}

jobs:
  uyari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Font ve kütüphaneler
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
      - name: Yeni uyarıları kontrol et
        run: |
          python -u uyari_bot.py --min-seviye orange --cikti yayin/uyari
          python -u haber_bot.py --cikti yayin/uyari
          python -u ozel_bot.py --cikti yayin/ozel || echo "Özel kart üretilemedi"
      - name: Sonuçları kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "hava-bot@users.noreply.github.com"
          git add durum.json yayin/uyari
          git add -A yayin/ozel ozel_durum.json 2>/dev/null || true
          git commit -m "Uyarı kontrolü $(date +%F_%H%M)" || echo "yeni uyarı yok"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q origin main && git push -q && break; sleep $((RANDOM % 5 + 2)); done
      - name: Instagram'a paylaş
        if: ${{ env.IG_TOKEN != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -u instagram_paylas.py uyari yayin/uyari || echo "Uyarılar paylaşılamadı"
          python -u instagram_paylas.py uyari yayin/ozel || echo "Özel kart paylaşılamadı"
      - name: Kuyruğu kaydet (bekleyen / tekrar denenecek kartlar)
        if: always()
        run: |
          for f in yayin/uyari/kuyruk.json yayin/uyari/akis.json yayin/ozel/kuyruk.json yayin/ozel/akis.json; do [ -f $f ] && git add $f; done; true
          git commit -qm "Uyarı kuyruğu $(date +%F_%H%M)" || echo "kuyruk değişmedi"
          for i in 1 2 3 4 5 6; do git pull --rebase --autostash -q origin main && git push -q && break; sleep $((RANDOM % 5 + 2)); done
      - name: Bilgi videosu zamanı mı? (Pzt/Çar/Cuma 12:00 sonrası, günde bir)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GUN=$(TZ=Europe/Istanbul date +%u); SAAT=$(TZ=Europe/Istanbul date +%H); BUGUN=$(TZ=Europe/Istanbul date +%F)
          SON=$(python -c "import json;print(json.load(open('bilgi_durum.json')).get('son',''))" 2>/dev/null || echo "")
          if [[ "$GUN" =~ ^(1|3|5)$ ]] && [ "$SAAT" -ge 12 ] && [ "$SAAT" -lt 18 ] && [ "$SON" != "$BUGUN" ]; then
            gh workflow run bilgi.yml --ref main && echo "Bilgi videosu tetiklendi"
          else echo "Bilgi videosu zamanı değil ($GUN $SAAT son=$SON)"; fi
          LSON=$(python -c "import json;print(json.load(open('liste_durum.json')).get('son',''))" 2>/dev/null || echo "")
          if [ "$SAAT" -ge 17 ] && [ "$SAAT" -lt 20 ] && [ "$LSON" != "$BUGUN" ]; then
            gh workflow run liste.yml --ref main && echo "Liste Reels'i tetiklendi"
          else echo "Liste zamanı değil ($SAAT son=$LSON)"; fi
