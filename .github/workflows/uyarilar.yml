name: Uyarılar, kapalı yollar ve son dakika hava haberleri

on:
  schedule:
    - cron: "41 * * * *"   # her saat
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uyarilar
  cancel-in-progress: false

env:
  IG_TOKEN: ${{ secrets.IG_TOKEN }}

jobs:
  uyari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Font ve kütüphaneler
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-inter
          pip install -r requirements.txt
      - name: Yeni uyarıları kontrol et
        run: |
          python -u uyari_bot.py --cikti yayin/uyari
          python -u haber_bot.py --cikti yayin/uyari
      - name: Sonuçları kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "hava-bot@users.noreply.github.com"
          git add durum.json yayin/uyari
          git commit -m "Uyarı kontrolü $(date +%F_%H%M)" || echo "yeni uyarı yok"
          git pull --rebase -q origin main && git push
      - name: Instagram'a paylaş
        if: ${{ env.IG_TOKEN != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -u instagram_paylas.py uyari yayin/uyari
