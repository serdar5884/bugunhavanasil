name: Hikayeleri sil
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, instagram_paylas as ig
          h = ig.istek(f"{ig.USER}/stories", {"fields": "id,timestamp"}, "GET").get("data", [])
          print("Aktif hikaye:", len(h))
          for x in h:
              u = f"{ig.API}/{x['id']}?" + urllib.parse.urlencode({"access_token": ig.TOKEN})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, method="DELETE"), timeout=30).read()
                  print("SILINDI", x["id"], x.get("timestamp"), r[:80])
              except urllib.error.HTTPError as e:
                  print("SILINEMEDI", x["id"], e.read()[:300])
          PY
