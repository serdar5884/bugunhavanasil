name: Yorum debug
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import instagram_paylas as ig
          m = ig.istek(f"{ig.USER}/media", {"fields": "id,comments_count,timestamp,media_type", "limit": 10}, "GET")["data"]
          for x in m:
              print(x)
              if x.get("comments_count"):
                  try:
                      print("   ->", ig.istek(f"{x['id']}/comments", {"fields": "id,text,username,timestamp"}, "GET"))
                  except Exception as e:
                      print("   HATA", e)
          PY
