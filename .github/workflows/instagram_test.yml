name: Instagram bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python instagram_paylas.py kontrol
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Anahtar süresi
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime
          t = os.environ["IG_TOKEN"].strip()
          print("Anahtar türü:", t[:4], "| uzunluk:", len(t), "| IG_USER_ID uzunluğu:", len(os.environ.get("IG_USER_ID", "").strip()))
          for taban in ("https://graph.instagram.com/v21.0", "https://graph.facebook.com/v21.0"):
              try:
                  r = json.loads(urllib.request.urlopen(taban + "/me?" + urllib.parse.urlencode({"fields": "id,user_id,username,name", "access_token": t}), timeout=30).read())
                  print(taban, "-> me:", {k: (v if k in ("username", "name") else ("aynı" if str(v) == os.environ.get("IG_USER_ID", "").strip() else "farklı")) for k, v in r.items()})
              except Exception as e:
                  print(taban, "-> me hatası:", getattr(e, "read", lambda: b"")()[:200])
          u = "https://graph.facebook.com/v21.0/debug_token?" + urllib.parse.urlencode({"input_token": t, "access_token": t})
          try:
              d = json.loads(urllib.request.urlopen(u, timeout=30).read())["data"]
              exp = d.get("expires_at", 0)
              print("Tür:", d.get("type"), "| Geçerli:", d.get("is_valid"),
                    "| Bitiş:", "süresiz" if not exp else datetime.datetime.utcfromtimestamp(exp).isoformat())
              print("Uygulama:", d.get("application"), "| İzinler:", ", ".join(d.get("scopes", [])))
              for g in d.get("granular_scopes", []):
                  print("  ", g.get("scope"), "->", g.get("target_ids"))
              u2 = "https://graph.facebook.com/v21.0/me/accounts?" + urllib.parse.urlencode({"fields": "name,instagram_business_account{id,username}", "access_token": t})
              try:
                  print("Sayfalar:", json.loads(urllib.request.urlopen(u2, timeout=30).read()).get("data"))
              except Exception as e:
                  print("Sayfa listesi yok (sayfa anahtarı olabilir):", getattr(e, "read", lambda: b"")()[:300])
              u3 = "https://graph.facebook.com/v21.0/me?" + urllib.parse.urlencode({"fields": "id,name,instagram_business_account{id,username}", "access_token": t})
              try:
                  print("Ben:", json.loads(urllib.request.urlopen(u3, timeout=30).read()))
              except Exception as e:
                  print("me okunamadı:", getattr(e, "read", lambda: b"")()[:300])
          except Exception as e:
              print("Süre okunamadı:", e)
          PY
