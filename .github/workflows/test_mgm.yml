name: MGM bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -q fonts-inter >/dev/null 2>&1; fc-list | grep -i inter | head -5
          curl -s -L -m 25 -A "Mozilla/5.0" https://www.kgm.gov.tr/ -o /tmp/h; wc -c /tmp/h
          grep -o -i 'href="[^"]*' /tmp/h | grep -i -E "yol|kapal|durum" | sort -u | head -40
