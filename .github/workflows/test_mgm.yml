name: MGM bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -L -m 25 -A "Mozilla/5.0" https://yol.kgm.gov.tr/kapaliyollar -o /tmp/h -w "HTTP %{http_code} %{url_effective}\n"; wc -c /tmp/h
          head -c 1500 /tmp/h; echo; echo ======
          grep -o -E '(src|href)="[^"]+\.js[^"]*"' /tmp/h | head
          for js in $(grep -o -E 'src="[^"]+\.js[^"]*"' /tmp/h | sed 's/src="//;s/"$//' | head -8); do
            case $js in http*) u=$js;; /*) u="https://yol.kgm.gov.tr$js";; *) u="https://yol.kgm.gov.tr/$js";; esac
            echo "--- $u"; curl -s -m 20 "$u" | grep -o -E '"(/|https?://)[^"]{3,120}(api|Api|API|kapal|Kapal|service|Service)[^"]{0,120}"' | sort -u | head -20
          done
          grep -o -i -E "(api|kapal)[a-z0-9/_.-]{0,80}" /tmp/h | sort -u | head -30
