name: MGM bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://yol.kgm.gov.tr/KapaliYollar
          curl -s -m 20 $B/js/app.7cff8deb.js -o app.js
          grep -o -E '.{0,200}js/.{0,400}' app.js | head -5
          echo =====
          curl -s -m 30 $B/js/vendor.906de3c4.js -o v.js; wc -c v.js
          grep -o -E '"(https?:)?//[^"]{4,150}"' v.js | grep -v -E "w3.org|github|mozilla|reactjs|vuejs|quasar|unpkg|jsdelivr" | sort -u | head -30
          grep -o -E '"/?[A-Za-z]*[Aa]pi[A-Za-z/_-]*"' v.js app.js | sort -u | head -30
