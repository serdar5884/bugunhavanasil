name: MGM bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://yol.kgm.gov.tr/KapaliYollar
          for f in 9.cacb6dfb 487.082333ea 541.e03bc4fa; do
            curl -s -m 20 $B/js/$f.js -o $f.js; echo "== $f $(wc -c < $f.js)"
            grep -o -E '"[^"]{0,40}(https?:|/api|Api|Service|\.ashx|\.json|Kapali|kapali|getir|Getir|Liste)[^"]{0,160}"' $f.js | sort -u | head -25
            grep -o -E '(get|post)\([^)]{0,200}\)' $f.js | head -10
          done
