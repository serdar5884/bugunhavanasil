name: MGM bağlantı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://yol.kgm.gov.tr/KapaliYollar
          curl -s -m 20 $B/js/app.7cff8deb.js -o app.js; wc -c app.js
          grep -o -E '"[^"]*(https?:|/api|Api|\.ashx|\.asmx|json|geoserver|arcgis|wfs|Service)[^"]{0,150}"' app.js | sort -u | head -40
          grep -o -E 'js/[A-Za-z0-9._-]+\.js' app.js | sort -u | head -20
          for c in $(grep -o -E '[0-9]+:"[0-9a-f]{8}"' app.js | head -15 | tr -d '"'); do n=${c%%:*}; h=${c##*:}; for f in "$B/js/$n.$h.js"; do curl -s -m 15 "$f" | grep -o -E '"[^"]*(https?:|/api|Api|\.ashx|json|geoserver|arcgis|wfs)[^"]{0,150}"' | sort -u | head -15 | sed "s|^|[$n] |"; done; done
