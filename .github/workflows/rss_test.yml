name: Haber akışı testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pillow && python -u haber_bot.py --liste
      - run: |
          python - <<'PY'
          from haber_bot import haberleri_cek
          h = haberleri_cek()
          from collections import Counter
          print(Counter(x["kaynak"] for x in h))
          for x in h[:3]: print(x["kaynak"], "|", x["baslik"][:90])
          PY
