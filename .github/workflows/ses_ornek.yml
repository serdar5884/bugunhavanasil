name: Ses örnekleri
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q piper-tts edge-tts
          mkdir -p ses_model
          for s in dfki fettah; do u="https://huggingface.co/rhasspy/piper-voices/resolve/main/tr/tr_TR/$s/medium/tr_TR-$s-medium"; curl -sfL "$u.onnx" -o ses_model/$s.onnx && curl -sfL "$u.onnx.json" -o ses_model/$s.onnx.json || rm -f ses_model/$s.onnx; done
          ls ses_model
          python -u ses_ornek.py
          git config user.name hava-bot && git config user.email hava-bot@users.noreply.github.com
          git add yayin/ses_ornek && git commit -qm "Ses örnekleri" && git pull --rebase -q origin main && git push -q
