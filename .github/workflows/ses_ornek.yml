name: Ses örnekleri
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q edge-tts
          python -u ses_ornek.py
          git config user.name hava-bot && git config user.email hava-bot@users.noreply.github.com
          git add yayin/ses_ornek2 && git commit -qm "Ses örnekleri 2" && git pull --rebase -q origin main && git push -q
