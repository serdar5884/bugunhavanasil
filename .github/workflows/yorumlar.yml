name: Yorumlara otomatik cevap

on:
  # cron-job.org her dakika tetikler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yorumlar
  cancel-in-progress: false

jobs:
  yorum:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Yorumları kontrol et ve cevapla
        run: python -u yorum_bot.py
      - name: Kaydet
        run: |
          git config user.name "hava-bot"
          git config user.email "hava-bot@users.noreply.github.com"
          git add yorum_durum.json
          git diff --cached --quiet && exit 0
          git commit -qm "Yorum cevapları"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 3; done
